<div class="service-card">
  <img [src]="service.image" [alt]="service.title">
  <h3>{{ service.title }}</h3>
  <p>{{ service.shortDescription }}</p>
  <button (click)="viewDetails.emit(service.id)">View More</button>
  <button (click)="toggleFavorite.emit(service)">
    {{ isFavorite ? '♥' : '♡' }}
  </button>
</div>
