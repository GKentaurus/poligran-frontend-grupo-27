<main class="favorites-page">
  <section class="favorites-intro">
    <span class="section-label">RECURSOS GUARDADOS</span>

    <h1>Tus servicios guardados</h1>

    <p>
      Revisa y gestiona los servicios que has guardado. Estas soluciones
      están pensadas para ayudarte a escalar de forma rápida y eficiente.
    </p>
  </section>

  <section class="favorites-grid" *ngIf="favorites.length > 0; else noFavorites">
    <article class="experience-card" *ngFor="let service of favorites; let first = first">
      <img [ngSrc]="service.image" [alt]="service.title" width="400" height="300" [priority]="first" />
      <div class="experience-body">
        <h3>{{ service.title }}</h3>
        <p>{{ service.description }}</p>

        <div class="favorite-actions">
          <a (click)="navigateToDetail(service.id)" class="mini-btn">Ver más →</a>
          <button (click)="removeFromFavorites(service.id)" class="remove-btn">Eliminar</button>
        </div>
      </div>
    </article>
  </section>

  <ng-template #noFavorites>
    <section class="no-favorites">
      <p>No tienes servicios guardados aún.</p>
      <a routerLink="/services" class="mini-btn">Explorar servicios →</a>
    </section>
  </ng-template>
</main>
